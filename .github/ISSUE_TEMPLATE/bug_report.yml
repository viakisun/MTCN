name: 🐛 버그 리포트
description: 몇타치니(MTCN) 앱에서 발견한 버그를 신고해주세요
title: "[버그] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해주셔서 감사합니다! 🏌️‍♂️
        
        아래 정보를 모두 작성해주시면 빠르게 문제를 해결할 수 있습니다.

  - type: textarea
    id: bug-description
    attributes:
      label: 🐛 버그 설명
      description: 발견한 버그에 대해 자세히 설명해주세요
      placeholder: "예: 홈 화면에서 앱이 갑자기 종료됩니다"
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 📋 재현 단계
      description: 버그를 재현하는 단계를 순서대로 작성해주세요
      placeholder: |
        1. 홈 화면으로 이동
        2. 특정 버튼 클릭
        3. 오류 발생
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ 예상 결과
      description: 정상적으로 동작했을 때 어떻게 되어야 하는지 설명해주세요
      placeholder: "버튼을 클릭하면 다음 화면으로 이동해야 합니다"
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ 실제 결과
      description: 실제로 어떤 일이 발생했는지 설명해주세요
      placeholder: "앱이 갑자기 종료되었습니다"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 📱 플랫폼
      description: 어떤 플랫폼에서 문제가 발생했나요?
      options:
        - Android
        - iOS
        - Web
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: 📱 디바이스 정보
      description: 사용 중인 디바이스 정보를 알려주세요 (선택사항)
      placeholder: "예: iPhone 14 Pro, Samsung Galaxy S23"

  - type: input
    id: app-version
    attributes:
      label: 📦 앱 버전
      description: 사용 중인 앱 버전을 알려주세요 (선택사항)
      placeholder: "예: 1.0.0"

  - type: input
    id: flutter-version
    attributes:
      label: 🎯 Flutter 버전
      description: Flutter 버전을 알려주세요 (개발자용)
      placeholder: "예: 3.24.5"

  - type: textarea
    id: error-logs
    attributes:
      label: 📝 에러 로그
      description: 에러 메시지나 로그가 있다면 붙여넣어주세요 (선택사항)
      placeholder: "에러 메시지를 여기에 붙여넣어주세요"

  - type: checkboxes
    id: additional-info
    attributes:
      label: ✅ 추가 정보
      description: 해당하는 항목을 체크해주세요
      options:
        - label: 이 문제가 처음 발생한 것입니다
          required: false
        - label: 이전 버전에서는 정상 작동했습니다
          required: false
        - label: 다른 사용자도 같은 문제를 겪고 있을 가능성이 있습니다
          required: false

  - type: markdown
    attributes:
      value: |
        ## 📞 도움이 필요하신가요?
        
        - 📖 [빠른 시작 가이드](https://github.com/viakisun/MTCN/blob/main/QUICK_START.md)
        - 🐛 [기존 이슈 검색](https://github.com/viakisun/MTCN/issues)
        - 💬 [토론 참여](https://github.com/viakisun/MTCN/discussions)
