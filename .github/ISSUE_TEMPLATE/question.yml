name: ❓ 질문
description: 몇타치니(MTCN) 앱에 대한 질문이나 도움이 필요하신가요?
title: "[질문] "
labels: ["question", "help-wanted"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        질문해주셔서 감사합니다! 🏌️‍♂️
        
        빠른 답변을 위해 가능한 한 자세히 설명해주세요.

  - type: textarea
    id: question
    attributes:
      label: ❓ 질문 내용
      description: 궁금한 점이나 도움이 필요한 부분을 자세히 설명해주세요
      placeholder: "예: 앱을 설치했는데 실행이 안 됩니다. 어떻게 해야 하나요?"
    validations:
      required: true

  - type: dropdown
    id: question-category
    attributes:
      label: 📂 질문 카테고리
      description: 질문의 유형을 선택해주세요
      options:
        - 설치 및 설정
        - 앱 사용법
        - 기능 관련
        - 개발 관련
        - 백엔드 관련
        - 버그 관련
        - 기타
    validations:
      required: true

  - type: textarea
    id: what-tried
    attributes:
      label: 🔍 시도해본 것들
      description: 이미 시도해본 방법이나 해결책이 있다면 알려주세요
      placeholder: "예: Flutter doctor를 실행했고, flutter clean && flutter pub get을 시도했습니다"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 💻 환경 정보
      description: 사용 중인 환경 정보를 알려주세요 (선택사항)
      placeholder: |
        - OS: macOS 14.0
        - Flutter 버전: 3.24.5
        - 디바이스: iPhone 14 Pro

  - type: checkboxes
    id: additional-info
    attributes:
      label: ✅ 추가 정보
      description: 해당하는 항목을 체크해주세요
      options:
        - label: 이 문제를 해결하면 다른 사용자에게도 도움이 될 것 같습니다
          required: false
        - label: 개발자입니다 (코드 관련 질문)
          required: false
        - label: 초보자입니다 (기본적인 설명이 필요합니다)
          required: false

  - type: markdown
    attributes:
      value: |
        ## 📚 도움말 자료
        
        ### 🚀 빠른 해결책
        - 📖 [빠른 시작 가이드](https://github.com/viakisun/MTCN/blob/main/QUICK_START.md) - 설치부터 실행까지
        - 🐛 [기존 이슈 검색](https://github.com/viakisun/MTCN/issues) - 비슷한 문제 찾기
        - 💬 [토론 게시판](https://github.com/viakisun/MTCN/discussions) - 커뮤니티 질문
        
        ### 🔧 일반적인 문제 해결
        - **앱이 실행되지 않을 때**: `flutter doctor` 실행 후 문제 해결
        - **의존성 문제**: `flutter clean && flutter pub get` 실행
        - **빌드 오류**: `flutter upgrade` 후 재시도
        
        ### 📞 다른 도움 방법
        - 🐛 [버그 신고](https://github.com/viakisun/MTCN/issues/new?template=bug_report.yml)
        - ✨ [기능 요청](https://github.com/viakisun/MTCN/issues/new?template=feature_request.yml)
