name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  issues:
    types: [opened, edited, closed]

# Issues 자동 연동을 위한 권한 설정
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Verify formatting
      run: dart format --set-exit-if-changed .
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
      
    - name: Build APK
      run: flutter build apk --release
      
  issue-auto-response:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Auto respond to new issues
      uses: actions/github-script@v7
      with:
        script: |
          const issue = context.payload.issue;
          
          if (context.payload.action === 'opened') {
            // 새 이슈에 자동 응답
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `안녕하세요! 🏌️‍♂️ 몇타치니(MTCN) 이슈를 등록해주셔서 감사합니다!
              
              ## 📋 다음 정보를 확인해주세요:
              
              - [ ] **버그 리포트인 경우**: 재현 단계와 예상 결과를 명시해주세요
              - [ ] **기능 요청인 경우**: 구체적인 사용 사례를 설명해주세요
              - [ ] **환경 정보**: Flutter 버전, OS, 디바이스 정보를 포함해주세요
              
              ## 🔗 유용한 링크:
              
              - 📖 [빠른 시작 가이드](https://github.com/viakisun/MTCN/blob/main/QUICK_START.md)
              - 📚 [README](https://github.com/viakisun/MTCN/blob/main/README.md)
              - 🐛 [기존 이슈 검색](https://github.com/viakisun/MTCN/issues)
              
              빠른 시일 내에 검토하겠습니다! 🙏`
            });
            
            // 라벨 자동 추가
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['triage', 'needs-review']
            });
          }
          
          if (context.payload.action === 'closed') {
            // 이슈가 해결되었을 때 감사 메시지
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `이슈가 해결되었습니다! 🎉
              
              몇타치니(MTCN)를 사용해주셔서 감사합니다. 
              추가로 도움이 필요하시면 언제든지 이슈를 등록해주세요! 🏌️‍♂️`
            });
          }
